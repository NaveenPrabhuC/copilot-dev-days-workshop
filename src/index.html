<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dev Days Quiz</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <section id="start-screen">
      <h1>Dev Days Quiz</h1>
      <p class="lead">Nine quick questions about Git, GitHub, Copilot and Actions.</p>
      <button id="start-btn" class="primary">Start quiz</button>
    </section>

    <section id="quiz-screen" hidden>
      <p id="progress" class="muted"></p>
      <p id="timer" class="timer">⏱ 15s</p>
      <h2 id="question-text"></h2>
      <ul id="options"></ul>
      <p id="feedback" aria-live="polite"></p>
      <button id="next-btn" class="primary" hidden>Next question</button>
    </section>

    <section id="result-screen" hidden>
      <h2>Quiz complete</h2>
      <p id="score-text" class="lead"></p>
      <p id="grade-text"></p>
      <button id="restart-btn" class="primary">Play again</button>
    </section>
  </main>

  <!-- Order matters: questions and logic load before the UI code -->
  <script src="questions.js"></script>
  <script src="quiz.js"></script>
  <script src="app.js"></script>
</body>
</html>
